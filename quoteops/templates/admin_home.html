{# Stage 2b part 2: who is signed in, when the session ends, and sign-out. The administrator
   pages of F18 are a later stage, so nothing links to them. #}
{% extends "admin_base.html" %}
{% block main %}
<h1>Signed in</h1>
<dl>
  <dt>Signed in as</dt><dd>{{ email }}</dd>
  <dt>Session ends</dt><dd>{{ ends }}</dd>
</dl>
<form method="post" action="/logout">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button type="submit">Sign out</button>
</form>
{% endblock %}
