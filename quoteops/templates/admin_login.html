{# One step: email, password and the code of the authenticator app. A failure never says which
   of the three was wrong, and the form is not filled in again. #}
{% extends "admin_base.html" %}
{% block main %}
<h1>Administrator sign-in</h1>
{% if failure %}<p role="alert">{{ failure }}</p>{% endif %}
<form method="post" action="/login" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p><label for="email">Email address</label><br>
    <input id="email" name="email" type="email" autocomplete="username"></p>
  <p><label for="password">Password</label><br>
    <input id="password" name="password" type="password" autocomplete="current-password"></p>
  <p><label for="code">Code from the authenticator app</label><br>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
      maxlength="6"></p>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
