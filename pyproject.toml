[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoteops"
version = "0.1.0"
description = "Quotation and invoice app for machining workshops"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.8",
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  "python-multipart==0.0.33",
]

[tool.setuptools]
packages = ["quoteops"]

[tool.setuptools.package-data]
quoteops = ["db/*.sql", "templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
